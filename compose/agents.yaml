services:
  agent:
    profiles: ["dsh", "opencode"]
    build:
      context: ../docker/universal-agent
      dockerfile: Dockerfile
    container_name: hydr4-agent
    user: "1000:1000"
    ports:
      - "127.0.0.1:4096:4096"
      - "127.0.0.1:3080:3080"
    environment:
      - AGENT_TYPE=${AGENT_TYPE:-opencode}
      - OPENAI_BASE_URL=http://aggregator:3001/v1
      - HYDRA_API_KEY=${FREELMAPI_UNIFIED_KEY}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_CONFIG=/configs/opencode.json
      - GIT_CONFIG_GLOBAL=/home/agent/.config/.gitconfig
    volumes:
      - ../../workspace:/workspace
      - ~/hydr4-data/agent/config:/home/agent/.config
      - ~/hydr4-data/agent/local-share:/home/agent/.local/share/opencode
      - ../configs:/configs:ro
      - ${AGENT_SSH_DIR:-./empty-ssh-dir}:/home/agent/.ssh:ro

    networks:
      - agent-net
    restart: unless-stopped
    depends_on:
      aggregator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
